[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "flash-attn>=2.8.3,<2.9",
    "matplotlib",
    "numpy",
    "PyYAML>=6.0",
    "rich",
    "safetensors",
    "torch>=2.4.0,<2.9",
    "triton>=3.0.0,<3.5",
    "transformers>=4.51.0",
    "tqdm",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*", "experiments*", "nanovllm*", "utils*"]

[tool.setuptools.package-data]
experiments = ["configs/*.yaml"]
